        - heading "What that means when you work with Greenline" [level=3] [ref=e165]
        - list [ref=e166]:
          - listitem [ref=e167]:
            - heading "The principal, not a placeholder." [level=4] [ref=e168]
            - paragraph [ref=e169]: At a big firm, the senior expert wins the work and a junior delivers it. With Greenline, the person who scopes your job is the person who does it — more than twenty years of cross-sector experience in the room every time, not on the letterhead.
          - listitem [ref=e170]:
            - heading "Fit-for-purpose, never shelf-ware." [level=4] [ref=e171]
            - paragraph [ref=e172]: No generic system with your logo dropped on top. Every deliverable is sized to your operation and written so the crew can read it. If you don’t need something, we won’t sell it to you.
          - listitem [ref=e173]:
            - heading "Independent and senior." [level=4] [ref=e174]
            - paragraph [ref=e175]: An external set of experienced eyes sees what familiarity hides — and, having worked across healthcare, rail, commercial, industrial and rural settings, recognises the near-miss that’s about to become an incident long before it shows up in a report.
          - listitem [ref=e176]:
            - heading "Plain English, not fear and jargon." [level=4] [ref=e177]
            - paragraph [ref=e178]: We explain the why in words people understand, so good practice outlives the engagement.
          - listitem [ref=e179]:
            - heading "Relationships over transactions." [level=4] [ref=e180]
            - paragraph [ref=e181]: We’re small enough to be genuinely responsive and flexible, and we’re in it for the long-term partnership — not the next invoice. When you call, you reach someone who already knows your site.
