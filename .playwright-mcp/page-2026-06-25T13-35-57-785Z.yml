        - generic [ref=e146]:
          - generic [ref=e147]:
            - paragraph [ref=e148]: Greenline HSE didn’t begin in a boardroom. It began on a family farm in County Mayo, on the west coast of Ireland.
            - paragraph [ref=e149]:
              - text: "Founder Catriona Monaghan grew up there, on land where the work was demanding, the weather rarely cooperated, and machinery, livestock and long days were simply part of life. A farm is one of the most dangerous workplaces there is — and it teaches you something that no qualification can:"
              - strong [ref=e150]: safety advice is worthless unless it fits the way people actually work.
              - text: A control that slows the job down, or insults the intelligence of the person doing it, gets quietly abandoned. A control that makes sense gets kept.
            - paragraph [ref=e151]: That lesson — practical, people-first, no theatre — has shaped more than twenty years of work across Australia and Ireland, on hospital builds, rail and transport infrastructure, commercial and residential developments, industrial facilities and rural operations alike.
            - paragraph [ref=e152]:
              - text: "It is also why Greenline exists. Catriona founded the firm to offer businesses something the big consultancies often can’t: senior, straightforward HSE support, tailored to the individual business, delivered by the person you actually talk to. We believe effective safety is about far more than compliance. It is about"
              - strong [ref=e153]: building trust, understanding operations, and delivering solutions that work in the real world.
              - text: Get those right and the compliance looks after itself.
