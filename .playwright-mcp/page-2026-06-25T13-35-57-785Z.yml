        - paragraph [ref=e67]: Let’s start with the picture most safety documents skip past.
        - generic [ref=e68]:
          - paragraph [ref=e69]:
            - text: In 2024,
            - strong [ref=e70]: 188 Australian workers did not come home from work
            - text: — each one a death from a traumatic, work-related injury. Construction accounted for
            - strong [ref=e71]: 37 of those deaths (around one in five)
            - text: ", sitting consistently among the small handful of industries that carry the heaviest toll."
            - emphasis [ref=e72]: "(Source: Safe Work Australia, Key Work Health and Safety Statistics.)"
          - paragraph [ref=e73]: "Two hazards dominate the construction story, and neither is exotic:"
          - list [ref=e74]:
            - listitem [ref=e75]:
              - strong [ref=e76]: Falls from height.
              - text: This remains one of the leading killers on Australian worksites, and construction carries the bulk of it — in a recent year, nearly
              - strong [ref=e77]: half of all fall-from-height fatalities
              - text: happened in our industry. Worryingly, the national fall-from-height death toll jumped sharply — up around
              - strong [ref=e78]: 71% in a single year
              - text: — a reminder that this is a live, present risk, not a solved problem.
            - listitem [ref=e79]:
              - strong [ref=e80]: Vehicles and moving plant.
              - text: Across all industries, vehicle incidents are the single largest cause of worker death — roughly
              - strong [ref=e81]: 42% of fatalities
              - text: . On a busy site, the line between “traffic management plan” and “tragedy” is often a few metres and a moment’s inattention.
          - complementary [ref=e82]:
            - generic [ref=e83]: ◆ Did you know?
            - paragraph [ref=e84]:
              - text: Labourers, trades workers and machinery operators account for the overwhelming majority of fall-from-height deaths. The people most exposed are often the ones with the least say in how the work is set up — which is exactly why systems have to be designed
              - emphasis [ref=e85]: with
              - text: them, not
              - emphasis [ref=e86]: at
              - text: them.
          - paragraph [ref=e87]:
            - text: And the harm isn’t only physical. In 2023–24 there were roughly
            - strong [ref=e88]: 146,700 serious workers’ compensation claims
            - text: — each one a person off work for a week or more. The fastest-growing category is
            - strong [ref=e89]: psychological injury
            - text: . Mental health conditions now make up over one in ten serious claims, and they keep people away from work around
            - strong [ref=e90]: five times longer
            - text: than the average physical injury. Psychosocial hazards are no longer a “soft” issue — under model WHS laws they are a regulated duty.
